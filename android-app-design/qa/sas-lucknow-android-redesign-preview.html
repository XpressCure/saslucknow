:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);

  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;

}

h1,
h2,
h3,
h4,
h5,
h6,
p {

h1 {

}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);

  font-family: var(--font-mono);

  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;

}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),

  padding: 4px 8px;

  border-radius: var(--radius-lg);

  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-small,
.viz-badge {

  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;

.btn,
.form-check-input,
.form-control,

}

.btn {
  appearance: button;
  display: inline-flex;

  min-height: 28px;
  align-items: center;

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;

  background: transparent;

  opacity: 0.4;

.form-label {

.form-control:disabled,

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

    [aria-pressed=&quot;true&quot;],

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

      async function fetchEmulatorVideoFeed(apiPath) {
        const proxyPath = `http://127.0.0.1:4193/emulator-api/${apiPath.replace(/^\/api\//, &#x27;&#x27;)}`;
        const candidates = [proxyPath, `https://www.saslucknow.in${apiPath}`];
        let lastError = null;
        for (const url of candidates) {
          try {
            const response = await fetch(url, { headers: { Accept: &#x27;application/json&#x27; }, cache: &#x27;no-store&#x27; });
            if (!response.ok) throw new Error(`Video feed returned ${response.status}`);
            const payload = await response.json();
            if (!payload || !Array.isArray(payload.items)) throw new Error(&#x27;Video feed returned an invalid response&#x27;);
            return payload.items;
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error(&#x27;The video feed is unavailable&#x27;);

          return `&lt;article class=&quot;sas-watch-card&quot; data-watch-card=&quot;Song of Savitri&quot; data-youtube-id=&quot;${youtubeId}&quot;&gt;&lt;img src=&quot;${thumbnail}&quot; alt=&quot;${escapeWatchHtml(title)} video thumbnail&quot; loading=&quot;lazy&quot;&gt;&lt;div class=&quot;sas-watch-copy&quot;&gt;&lt;small&gt;PART ${escapeWatchHtml(item.part || &#x27;1&#x27;)} · BOOK ${escapeWatchHtml(item.bookNo || &#x27;&#x27;)}&lt;/small&gt;&lt;h3&gt;${escapeWatchHtml(title)}&lt;/h3&gt;&lt;div class=&quot;sas-ref-grid&quot;&gt;&lt;div&gt;&lt;b&gt;Part&lt;/b&gt;${escapeWatchHtml(item.part || &#x27;1&#x27;)}&lt;/div&gt;&lt;div&gt;&lt;b&gt;Book No.&lt;/b&gt;${escapeWatchHtml(item.bookNo || &#x27;&#x27;)}&lt;/div&gt;&lt;div&gt;&lt;b&gt;Canto No.&lt;/b&gt;${escapeWatchHtml(item.cantoNo || &#x27;&#x27;)}&lt;/div&gt;&lt;div&gt;&lt;b&gt;Name of Canto&lt;/b&gt;${escapeWatchHtml(title)}&lt;/div&gt;&lt;div&gt;&lt;b&gt;Line Nos.&lt;/b&gt;${escapeWatchHtml(item.lineNos || &#x27;&#x27;)}&lt;/div&gt;&lt;div&gt;&lt;b&gt;Page No.&lt;/b&gt;${escapeWatchHtml(item.pageNo || &#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;${sharedActions}&lt;/div&gt;&lt;/article&gt;`;
        }
        const date = item.eventDate ? new Date(`${item.eventDate}T12:00:00`).toLocaleDateString(&#x27;en-IN&#x27;, { dateStyle: &#x27;medium&#x27; }) : &#x27;SAS Lucknow&#x27;;
        return `&lt;article class=&quot;sas-watch-card&quot; data-watch-card=&quot;Gatherings&quot; data-youtube-id=&quot;${youtubeId}&quot;&gt;&lt;img src=&quot;${thumbnail}&quot; alt=&quot;${escapeWatchHtml(title)} video thumbnail&quot; loading=&quot;lazy&quot;&gt;&lt;div class=&quot;sas-watch-copy&quot;&gt;&lt;small&gt;${escapeWatchHtml(item.category || &#x27;COLLECTIVE LEARNINGS&#x27;)}&lt;/small&gt;&lt;h3&gt;${escapeWatchHtml(title)}&lt;/h3&gt;&lt;p&gt;${escapeWatchHtml(date)} · YouTube&lt;/p&gt;${sharedActions}&lt;/div&gt;&lt;/article&gt;`;
      }
      const reflectionStorageKey = &#x27;sas-lucknow-private-reflections-v1&#x27;;
      let selectedReflectionDate = &#x27;&#x27;;
      let currentReflectionId = &#x27;&#x27;;
      let reflectionCalendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

      function loadReflections() {
        try {
          const parsed = JSON.parse(localStorage.getItem(reflectionStorageKey) || &#x27;[]&#x27;);
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      function storeReflections(entries) {
        try {
          localStorage.setItem(reflectionStorageKey, JSON.stringify(entries));
          return true;
        } catch (error) {
          return false;
        }
      }

      function reflectionId() {
        if (window.crypto &amp;&amp; typeof window.crypto.randomUUID === &#x27;function&#x27;) return window.crypto.randomUUID();
        return `reflection-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function localDateKey(value) {
        const date = value instanceof Date ? value : new Date(value);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, &#x27;0&#x27;);
        const day = String(date.getDate()).padStart(2, &#x27;0&#x27;);
        return `${year}-${month}-${day}`;
      }

      function escapeReflectionHtml(value) {
        return String(value || &#x27;&#x27;)
          .replace(/&amp;/g, &#x27;&amp;amp;&#x27;)
          .replace(/&lt;/g, &#x27;&amp;lt;&#x27;)
          .replace(/&gt;/g, &#x27;&amp;gt;&#x27;)
          .replace(/&quot;/g, &#x27;&amp;quot;&#x27;)
          .replace(/&#x27;/g, &#x27;&amp;#39;&#x27;);
      }

      function reflectionDateTime(value) {
        return new Intl.DateTimeFormat(&#x27;en-IN&#x27;, {
          dateStyle: &#x27;medium&#x27;,
          timeStyle: &#x27;short&#x27;
        }).format(new Date(value));
      }

      function readReflectionImage(file) {
        if (!file) return Promise.resolve(&#x27;&#x27;);
        if (!file.type.startsWith(&#x27;image/&#x27;)) return Promise.reject(new Error(&#x27;Please choose an image file.&#x27;));
        if (file.size &gt; 8 * 1024 * 1024) return Promise.reject(new Error(&#x27;Please choose an image smaller than 8 MB.&#x27;));
        return new Promise((resolve, reject) =&gt; {
          const reader = new FileReader();
          reader.onerror = () =&gt; reject(new Error(&#x27;The image could not be read.&#x27;));
          reader.onload = () =&gt; {
            const image = new Image();
            image.onerror = () =&gt; reject(new Error(&#x27;The image could not be prepared.&#x27;));
            image.onload = () =&gt; {
              const maxSide = 1280;
              const scale = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
              const canvas = document.createElement(&#x27;canvas&#x27;);
              canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
              canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
              const context = canvas.getContext(&#x27;2d&#x27;);
              context.drawImage(image, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL(&#x27;image/jpeg&#x27;, .78));
            };
            image.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

      function bindReflectionImagePreview(input, preview) {
        if (!input || !preview) return;
        input.addEventListener(&#x27;change&#x27;, () =&gt; {
          const file = input.files &amp;&amp; input.files[0];
          if (!file) {
            preview.removeAttribute(&#x27;src&#x27;);
            preview.classList.remove(&#x27;sas-visible&#x27;);
            return;
          }
          const reader = new FileReader();
          reader.onload = () =&gt; {
            preview.src = reader.result;
            preview.classList.add(&#x27;sas-visible&#x27;);
          };
          reader.readAsDataURL(file);
        });
      }

      function reflectionEntryById(id) {
        return loadReflections().find(entry =&gt; entry.id === id) || null;
      }

      function renderReflectionsPage() {
        const host = mount.querySelector(&#x27;#sas-reflections-page&#x27;);
        if (!host) return;
        const entries = loadReflections().sort((a, b) =&gt; new Date(b.createdAt) - new Date(a.createdAt));
        const visible = selectedReflectionDate
          ? entries.filter(entry =&gt; (entry.dateKey || localDateKey(entry.createdAt)) === selectedReflectionDate)
          : entries;
        const markedDates = new Map();
        entries.forEach(entry =&gt; {
          const key = entry.dateKey || localDateKey(entry.createdAt);
          markedDates.set(key, (markedDates.get(key) || 0) + 1);
        });
        host.innerHTML = `
          &lt;div class=&quot;sas-reflections-shell&quot;&gt;
            &lt;div class=&quot;sas-journal-summary&quot;&gt;&lt;div&gt;&lt;strong&gt;${entries.length}&lt;/strong&gt;&lt;span&gt;private ${entries.length === 1 ? &#x27;reflection&#x27; : &#x27;reflections&#x27;} kept on this device&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;sas-primary&quot; type=&quot;button&quot; id=&quot;sas-journal-inner-room&quot;&gt;Enter Inner Room&lt;/button&gt;&lt;/div&gt;
            &lt;section class=&quot;sas-calendar&quot; aria-label=&quot;Reflection calendar&quot;&gt;
              &lt;div class=&quot;sas-calendar-head&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;sas-calendar-prev&quot; aria-label=&quot;Previous month&quot;&gt;‹&lt;/button&gt;&lt;strong id=&quot;sas-calendar-title&quot;&gt;&lt;/strong&gt;&lt;button type=&quot;button&quot; id=&quot;sas-calendar-next&quot; aria-label=&quot;Next month&quot;&gt;›&lt;/button&gt;&lt;/div&gt;
              &lt;div class=&quot;sas-calendar-weekdays&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;SUN&lt;/span&gt;&lt;span&gt;MON&lt;/span&gt;&lt;span&gt;TUE&lt;/span&gt;&lt;span&gt;WED&lt;/span&gt;&lt;span&gt;THU&lt;/span&gt;&lt;span&gt;FRI&lt;/span&gt;&lt;span&gt;SAT&lt;/span&gt;&lt;/div&gt;

              &lt;div class=&quot;sas-calendar-footer&quot;&gt;&lt;small&gt;A green underline marks a day with saved thoughts.&lt;/small&gt;&lt;button type=&quot;button&quot; id=&quot;sas-calendar-clear&quot;&gt;Show all&lt;/button&gt;&lt;/div&gt;
            &lt;/section&gt;
            &lt;div&gt;&lt;p class=&quot;sas-kicker&quot;&gt;${selectedReflectionDate ? &#x27;SELECTED DATE&#x27; : &#x27;LATEST FIRST&#x27;}&lt;/p&gt;&lt;h2 style=&quot;margin:5px 0 11px&quot;&gt;${selectedReflectionDate ? new Date(`${selectedReflectionDate}T12:00:00`).toLocaleDateString(&#x27;en-IN&#x27;, { dateStyle: &#x27;long&#x27; }) : &#x27;Your quiet record&#x27;}&lt;/h2&gt;&lt;div class=&quot;sas-reflection-list&quot; id=&quot;sas-reflection-list&quot;&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;`;

        const monthTitle = host.querySelector(&#x27;#sas-calendar-title&#x27;);
        monthTitle.textContent = reflectionCalendarMonth.toLocaleDateString(&#x27;en-IN&#x27;, { month: &#x27;long&#x27;, year: &#x27;numeric&#x27; });
        const calendarGrid = host.querySelector(&#x27;#sas-calendar-grid&#x27;);
        const year = reflectionCalendarMonth.getFullYear();
        const month = reflectionCalendarMonth.getMonth();
        const offset = new Date(year, month, 1).getDay();
        for (let index = 0; index &lt; 42; index += 1) {
          const date = new Date(year, month, index - offset + 1);
          const key = localDateKey(date);
          const count = markedDates.get(key) || 0;
          const button = document.createElement(&#x27;button&#x27;);
          button.type = &#x27;button&#x27;;
          button.className = &#x27;sas-calendar-day&#x27;;
          if (date.getMonth() !== month) button.classList.add(&#x27;sas-outside&#x27;);
          if (count) button.classList.add(&#x27;sas-has-reflections&#x27;);
          button.setAttribute(&#x27;aria-pressed&#x27;, String(key === selectedReflectionDate));
          button.setAttribute(&#x27;aria-label&#x27;, `${date.toLocaleDateString(&#x27;en-IN&#x27;, { day: &#x27;numeric&#x27;, month: &#x27;long&#x27;, year: &#x27;numeric&#x27; })}${count ? `, ${count} saved ${count === 1 ? &#x27;reflection&#x27; : &#x27;reflections&#x27;}` : &#x27;&#x27;}`);
          button.textContent = String(date.getDate());
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            selectedReflectionDate = key;
            reflectionCalendarMonth = new Date(date.getFullYear(), date.getMonth(), 1);
            renderReflectionsPage();
          });
          calendarGrid.append(button);
        }

        const list = host.querySelector(&#x27;#sas-reflection-list&#x27;);
        if (!visible.length) {
          list.innerHTML = `&lt;div class=&quot;sas-empty-journal&quot;&gt;&lt;h3&gt;No reflection on this date&lt;/h3&gt;&lt;p&gt;Choose a green-underlined date, show all entries, or return to the Inner Room.&lt;/p&gt;&lt;/div&gt;`;
        } else {
          visible.forEach(entry =&gt; {
            const date = new Date(entry.createdAt);
            const followUps = Array.isArray(entry.followUps) ? entry.followUps.length : 0;
            const row = document.createElement(&#x27;button&#x27;);
            row.type = &#x27;button&#x27;;
            row.className = &#x27;sas-reflection-row&#x27;;
            row.setAttribute(&#x27;aria-label&#x27;, `Open reflection from ${reflectionDateTime(entry.createdAt)}`);
            row.innerHTML = `&lt;span class=&quot;sas-reflection-date&quot;&gt;&lt;strong&gt;${date.getDate()}&lt;/strong&gt;&lt;small&gt;${date.toLocaleDateString(&#x27;en-IN&#x27;, { month: &#x27;short&#x27; }).toUpperCase()}&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;sas-reflection-copy&quot;&gt;&lt;strong&gt;${escapeReflectionHtml(entry.thought)}&lt;/strong&gt;&lt;small&gt;${reflectionDateTime(entry.createdAt)}${entry.image ? &#x27; · Image attached&#x27; : &#x27;&#x27;}${followUps ? ` · ${followUps} further ${followUps === 1 ? &#x27;thought&#x27; : &#x27;thoughts&#x27;}` : &#x27;&#x27;}&lt;/small&gt;&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;›&lt;/span&gt;`;
            row.addEventListener(&#x27;click&#x27;, () =&gt; {
              currentReflectionId = entry.id;
              render(&#x27;reflection-detail&#x27;);
            });
            list.append(row);
          });
        }
        host.querySelector(&#x27;#sas-journal-inner-room&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; render(&#x27;inner-room&#x27;));
        host.querySelector(&#x27;#sas-calendar-prev&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
          reflectionCalendarMonth = new Date(year, month - 1, 1);
          renderReflectionsPage();

        host.querySelector(&#x27;#sas-calendar-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
          reflectionCalendarMonth = new Date(year, month + 1, 1);

          renderReflectionsPage();
        });

        host.querySelector(&#x27;#sas-save-followup&#x27;).addEventListener(&#x27;click&#x27;, async event =&gt; {
          const button = event.currentTarget;
          const thought = host.querySelector(&#x27;#sas-followup-thought&#x27;).value.trim();
          const status = host.querySelector(&#x27;#sas-followup-status&#x27;);
          if (!thought) {

            status.classList.remove(&#x27;sas-hidden&#x27;);
            return;

          button.disabled = true;
          button.textContent = &#x27;Saving…&#x27;;
          try {
            const image = await readReflectionImage(imageInput.files &amp;&amp; imageInput.files[0]);
            const entries = loadReflections();
            const index = entries.findIndex(item =&gt; item.id === entry.id);
            if (index === -1) throw new Error(&#x27;This reflection could not be found.&#x27;);
            const followUp = { id: reflectionId(), createdAt: new Date().toISOString(), thought, image };
            entries[index].followUps = Array.isArray(entries[index].followUps) ? entries[index].followUps : [];
            entries[index].followUps.push(followUp);
            if (!storeReflections(entries)) throw new Error(&#x27;There is not enough private device storage for this image. Try a smaller image.&#x27;);
            renderReflectionDetail();
          } catch (error) {
            status.textContent = error.message;
            status.classList.remove(&#x27;sas-hidden&#x27;);
            button.disabled = false;
            button.textContent = &#x27;Save to this reflection&#x27;;
          }
        });
      }

      function ensureInnerSound() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!innerSound) {
          const context = new AudioContextClass();
          const master = context.createGain();
          const filter = context.createBiquadFilter();
          filter.type = &#x27;lowpass&#x27;;
          filter.frequency.value = 1400;
          filter.Q.value = .4;
          master.gain.value = 0;
          filter.connect(master).connect(context.destination);

      function createMemberScreen(screen, kicker, title, intro, bodyHtml) {
        if (root.querySelector(`#sas-screen-${screen}`)) return;
        const source = root.querySelector(&#x27;#sas-screen-parichay&#x27;);
        const template = document.createElement(&#x27;template&#x27;);
        const fragment = source.content.cloneNode(true);
        template.id = `sas-screen-${screen}`;
        const headerContext = fragment.querySelector(&#x27;.sas-brand small&#x27;);
        if (headerContext) headerContext.textContent = title.toUpperCase();
        const hero = fragment.querySelector(&#x27;.sas-section-dark&#x27;);
        hero.innerHTML = `&lt;p class=&quot;sas-kicker&quot;&gt;${kicker}&lt;/p&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;p&gt;${intro}&lt;/p&gt;`;
        const sections = fragment.querySelectorAll(&#x27;.sas-section&#x27;);
        if (sections[1]) sections[1].innerHTML = bodyHtml;
        template.content.append(fragment);
        root.append(template);
      }

      function nextHumanRowPrice(rowIndex) {
        if (rowIndex &lt; 4) return { category: &#x27;Uday&#x27;, price: 1500 };
        if (rowIndex &lt; 10) return { category: &#x27;Pragati&#x27;, price: 1000 };
        return { category: &#x27;Sahabhagita&#x27;, price: 750 };
      }

      function nextHumanAge(dateOfBirth) {
        const birth = new Date(`${dateOfBirth}T12:00:00`);
        const eventDate = new Date(&#x27;2026-12-20T12:00:00&#x27;);
        if (Number.isNaN(birth.getTime()) || birth &gt;= eventDate) return -1;
        let age = eventDate.getFullYear() - birth.getFullYear();
        if (eventDate &lt; new Date(eventDate.getFullYear(), birth.getMonth(), birth.getDate(), 12)) age -= 1;
        return age;
      }

      function nextHumanApplicationStatus(statusHost, questionHost, bookingSection) {
        if (nextHumanState.applicationStatus === &#x27;not_started&#x27;) return;
        if (nextHumanState.applicationStatus === &#x27;questions&#x27;) {
          const title = nextHumanState.pathway === &#x27;challenge&#x27; ? &#x27;NEXT HUMAN Challenge&#x27; : &#x27;NEXT HUMAN Fellowship&#x27;;
          const ageLabel = nextHumanState.pathway === &#x27;challenge&#x27; ? &#x27;18–39 years&#x27; : &#x27;40 years and above&#x27;;
          questionHost.innerHTML = `&lt;div class=&quot;sas-nh-pathway-result&quot;&gt;&lt;strong&gt;${title}&lt;/strong&gt;&lt;span&gt;${ageLabel} · Five questions for thoughtful selection&lt;/span&gt;&lt;/div&gt;&lt;form class=&quot;sas-nh-form&quot; data-nh-answer-form&gt;${nextHumanQuestions[nextHumanState.pathway].map((question, index) =&gt; `&lt;label&gt;${index + 1}. ${question}&lt;textarea name=&quot;answer-${index}&quot; minlength=&quot;20&quot; required placeholder=&quot;Write your considered response...&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;button class=&quot;sas-nh-primary&quot; type=&quot;submit&quot;&gt;Submit for review →&lt;/button&gt;&lt;/form&gt;`;
          const answerForm = questionHost.querySelector(&#x27;[data-nh-answer-form]&#x27;);
          const submitAnswers = event =&gt; {
            event.preventDefault();
            const answers = [...answerForm.querySelectorAll(&#x27;textarea&#x27;)].map(field =&gt; field.value.trim());
            if (answers.some(answer =&gt; answer.length &lt; 20)) {
              statusHost.innerHTML = &#x27;&lt;div class=&quot;sas-nh-status&quot;&gt;&lt;strong&gt;Please go a little deeper.&lt;/strong&gt;Each response needs at least 20 characters before it can be submitted.&lt;/div&gt;&#x27;;
              return;
            }
            nextHumanState.applicationStatus = &#x27;submitted&#x27;;
            questionHost.innerHTML = &#x27;&#x27;;
            nextHumanApplicationStatus(statusHost, questionHost, bookingSection);
          };
          answerForm.addEventListener(&#x27;submit&#x27;, submitAnswers);
          answerForm.querySelector(&#x27;button[type=&quot;submit&quot;]&#x27;).addEventListener(&#x27;click&#x27;, submitAnswers);
          return;
        }
        if (nextHumanState.applicationStatus === &#x27;submitted&#x27;) {
          statusHost.innerHTML = &#x27;&lt;div class=&quot;sas-nh-status&quot;&gt;&lt;strong&gt;Application received.&lt;/strong&gt;Your five responses have been submitted for administrator review. We will notify you here after a decision.&lt;/div&gt;&#x27;;
          return;
        }
        statusHost.innerHTML = &#x27;&lt;div class=&quot;sas-nh-status&quot;&gt;&lt;strong&gt;Approved for booking.&lt;/strong&gt;Select and pay for only the days you will attend. Your admission is valid for both Challenge and Fellowship seating allocations as approved.&lt;/div&gt;&#x27;;
        bookingSection.classList.remove(&#x27;sas-hidden&#x27;);
        nextHumanRenderBookingDays(bookingSection);
        setTimeout(() =&gt; bookingSection.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; }), 50);
      }

      function nextHumanRenderBookingDays(bookingSection) {
        const host = bookingSection.querySelector(&#x27;[data-nh-booking-days]&#x27;);
        host.innerHTML = nextHumanDays.map(day =&gt; {
          const booking = nextHumanState.bookings.get(day.id);
          return `&lt;article class=&quot;sas-nh-booking-day${booking ? &#x27; booked&#x27; : &#x27;&#x27;}&quot;&gt;&lt;span class=&quot;sas-nh-day-number&quot;&gt;${day.number}&lt;/span&gt;&lt;div&gt;&lt;h3&gt;${day.title}&lt;/h3&gt;&lt;p&gt;${day.date} 2026 · 5:00–8:00 PM · independent day pass&lt;/p&gt;&lt;div class=&quot;sas-nh-day-actions&quot;&gt;${booking ? `&lt;span&gt;BOOKED · ${booking.seats.join(&#x27;, &#x27;)}&lt;/span&gt;&lt;button type=&quot;button&quot; data-nh-open-day=&quot;${day.id}&quot;&gt;View pass&lt;/button&gt;` : `&lt;button type=&quot;button&quot; data-nh-open-day=&quot;${day.id}&quot;&gt;Choose seats →&lt;/button&gt;&lt;span&gt;₹750–₹1,500 per seat&lt;/span&gt;`}&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;`;
        }).join(&#x27;&#x27;);

      }

      function nextHumanOpenSeatStudio(bookingSection, dayId) {
        const day = nextHumanDays.find(item =&gt; item.id === dayId);
        const host = bookingSection.querySelector(&#x27;[data-nh-seat-studio]&#x27;);
        const confirmed = nextHumanState.bookings.get(dayId);
        nextHumanState.selectedDayId = dayId;
        nextHumanState.selectedSeats = new Set();
        if (confirmed) {
          host.innerHTML = `&lt;article class=&quot;sas-nh-pass&quot;&gt;&lt;strong&gt;Day ${day.number} is booked&lt;/strong&gt;&lt;b&gt;NH26-D${day.number}-${String(day.number).padStart(2, &#x27;0&#x27;)}PASS&lt;/b&gt;&lt;span&gt;${day.title}&lt;br&gt;${confirmed.seats.join(&#x27;, &#x27;)} · ₹${confirmed.amount.toLocaleString(&#x27;en-IN&#x27;)}&lt;/span&gt;&lt;button class=&quot;sas-nh-secondary&quot; type=&quot;button&quot; data-nh-close-seat style=&quot;width:100%;margin-top:14px&quot;&gt;Close pass&lt;/button&gt;&lt;/article&gt;`;
          host.querySelector(&#x27;[data-nh-close-seat]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { host.innerHTML = &#x27;&#x27;; });
          host.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });
          return;
        }
        const rows = &#x27;ABCDEFGHIJKLMNOPQRST&#x27;.split(&#x27;&#x27;).map((row, rowIndex) =&gt; {
          const seats = Array.from({ length: 25 }, (_, seatIndex) =&gt; {
            const number = seatIndex + 1;
            const occupied = ((rowIndex * 25 + number) % 31 === 0) || ((rowIndex * 25 + number) % 47 === 0);
            return `&lt;button type=&quot;button&quot; class=&quot;sas-nh-seat${occupied ? &#x27; occupied&#x27; : &#x27;&#x27;}&quot; data-seat-id=&quot;${row}${number}&quot; data-seat-price=&quot;${nextHumanRowPrice(rowIndex).price}&quot; ${occupied ? &#x27;disabled&#x27; : &#x27;&#x27;} aria-label=&quot;Seat ${row}${number}&quot;&gt;${row}${number}&lt;/button&gt;`;
          }).join(&#x27;&#x27;);
          return `&lt;div class=&quot;sas-nh-seat-row&quot;&gt;&lt;span&gt;${row}&lt;/span&gt;${seats}&lt;/div&gt;`;
        }).join(&#x27;&#x27;);
        host.innerHTML = `&lt;article class=&quot;sas-nh-seat-studio&quot;&gt;&lt;header&gt;&lt;div&gt;&lt;p class=&quot;sas-nh-eyebrow&quot;&gt;DAY ${day.number} · ${day.date.toUpperCase()}&lt;/p&gt;&lt;h3&gt;${day.title}&lt;/h3&gt;&lt;p&gt;Select your seat and up to two companion seats.&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;sas-nh-seat-close&quot; type=&quot;button&quot; data-nh-close-seat aria-label=&quot;Close seat selection&quot;&gt;×&lt;/button&gt;&lt;/header&gt;&lt;div class=&quot;sas-nh-stage&quot;&gt;STAGE · LEAD EXPLORER&lt;/div&gt;&lt;div class=&quot;sas-nh-seat-scroll&quot;&gt;${rows}&lt;/div&gt;&lt;div class=&quot;sas-nh-seat-summary&quot; data-nh-seat-summary&gt;&lt;/div&gt;&lt;div data-nh-payment&gt;&lt;/div&gt;&lt;/article&gt;`;
        const studio = host.querySelector(&#x27;.sas-nh-seat-studio&#x27;);
        const summary = studio.querySelector(&#x27;[data-nh-seat-summary]&#x27;);
        const paymentHost = studio.querySelector(&#x27;[data-nh-payment]&#x27;);
        const updateSummary = () =&gt; {
          const seatButtons = [...studio.querySelectorAll(&#x27;.sas-nh-seat.selected&#x27;)];
          const total = seatButtons.reduce((sum, seat) =&gt; sum + Number(seat.dataset.seatPrice || 0), 0);
          const companionCount = Math.max(0, seatButtons.length - 1);
          summary.innerHTML = `&lt;strong&gt;${seatButtons.length ? seatButtons.map(seat =&gt; seat.dataset.seatId).join(&#x27;, &#x27;) : &#x27;No seat selected&#x27;}&lt;/strong&gt;&lt;small&gt;${seatButtons.length} of 3 seats · ${seatButtons.length ? `₹${total.toLocaleString(&#x27;en-IN&#x27;)} for Day ${day.number} only` : &#x27;Tap an available seat to begin&#x27;}&lt;/small&gt;&lt;div class=&quot;sas-nh-companions&quot;&gt;${Array.from({ length: companionCount }, (_, index) =&gt; `&lt;input type=&quot;text&quot; data-nh-companion placeholder=&quot;Companion ${index + 1} full name&quot; aria-label=&quot;Companion ${index + 1} full name&quot;&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;button class=&quot;sas-nh-primary&quot; type=&quot;button&quot; data-nh-proceed ${seatButtons.length ? &#x27;&#x27; : &#x27;disabled&#x27;} style=&quot;width:100%&quot;&gt;Proceed to Day ${day.number} payment →&lt;/button&gt;`;
          const proceed = summary.querySelector(&#x27;[data-nh-proceed]&#x27;);
          proceed?.addEventListener(&#x27;click&#x27;, () =&gt; {
            const companions = [...summary.querySelectorAll(&#x27;[data-nh-companion]&#x27;)].map(input =&gt; input.value.trim());
            if (companions.some(name =&gt; !name)) {
              paymentHost.innerHTML = &#x27;&lt;div class=&quot;sas-nh-payment&quot;&gt;&lt;strong&gt;Companion name required&lt;/strong&gt;&lt;p&gt;Add one name for every additional seat.&lt;/p&gt;&lt;/div&gt;&#x27;;
              return;
            }
            const seats = seatButtons.map(seat =&gt; seat.dataset.seatId);
            paymentHost.innerHTML = `&lt;div class=&quot;sas-nh-payment&quot;&gt;&lt;strong&gt;₹${total.toLocaleString(&#x27;en-IN&#x27;)} · Day ${day.number}&lt;/strong&gt;&lt;p&gt;This payment books only ${day.date}. The remaining six days stay available for separate booking.&lt;/p&gt;&lt;button class=&quot;sas-nh-primary&quot; type=&quot;button&quot; data-nh-confirm-payment style=&quot;width:100%&quot;&gt;Complete secure test payment&lt;/button&gt;&lt;small style=&quot;display:block;margin-top:9px&quot;&gt;Emulator verification only. The final Android app will use the live Razorpay checkout.&lt;/small&gt;&lt;/div&gt;`;
            paymentHost.querySelector(&#x27;[data-nh-confirm-payment]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
              nextHumanState.bookings.set(dayId, { seats, companions, amount: total });
              nextHumanRenderBookingDays(bookingSection);
              host.innerHTML = `&lt;article class=&quot;sas-nh-pass&quot;&gt;&lt;strong&gt;Your Day ${day.number} pass is ready&lt;/strong&gt;&lt;b&gt;NH26-D${day.number}-${Date.now().toString().slice(-6)}&lt;/b&gt;&lt;span&gt;${day.title}&lt;br&gt;${seats.join(&#x27;, &#x27;)} · ₹${total.toLocaleString(&#x27;en-IN&#x27;)}&lt;/span&gt;&lt;p&gt;Only ${day.date} 2026 is booked. Choose another day separately if required.&lt;/p&gt;&lt;button class=&quot;sas-nh-secondary&quot; type=&quot;button&quot; data-nh-close-seat style=&quot;width:100%&quot;&gt;Continue&lt;/button&gt;&lt;/article&gt;`;
              host.querySelector(&#x27;[data-nh-close-seat]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { host.innerHTML = &#x27;&#x27;; });
              host.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;center&#x27; });
            });
          });
        };
        studio.querySelectorAll(&#x27;.sas-nh-seat:not(.occupied)&#x27;).forEach(seat =&gt; seat.addEventListener(&#x27;click&#x27;, () =&gt; {
          const selected = seat.classList.contains(&#x27;selected&#x27;);
          if (!selected &amp;&amp; nextHumanState.selectedSeats.size &gt;= 3) {
            paymentHost.innerHTML = &#x27;&lt;div class=&quot;sas-nh-payment&quot;&gt;&lt;strong&gt;Maximum three seats&lt;/strong&gt;&lt;p&gt;One participant may bring no more than two companions on each day.&lt;/p&gt;&lt;/div&gt;&#x27;;
            return;
          }
          seat.classList.toggle(&#x27;selected&#x27;, !selected);
          if (selected) nextHumanState.selectedSeats.delete(seat.dataset.seatId); else nextHumanState.selectedSeats.add(seat.dataset.seatId);
          paymentHost.innerHTML = &#x27;&#x27;;
          updateSummary();
        }));
        studio.querySelector(&#x27;[data-nh-close-seat]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { host.innerHTML = &#x27;&#x27;; });
        updateSummary();
        host.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });
      }

      function bindNextHumanScreen() {
        const begin = mount.querySelector(&#x27;[data-nh-begin]&#x27;);
        const application = mount.querySelector(&#x27;#sas-nh-application&#x27;);

          nextHumanState.pathway = age &lt; 40 ? &#x27;challenge&#x27; : &#x27;fellowship&#x27;;
          nextHumanState.applicationStatus = &#x27;questions&#x27;;
          statusHost.innerHTML = &#x27;&#x27;;
          nextHumanApplicationStatus(statusHost, questionHost, bookingSection);
          questionHost.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });

      function render(screen, options = {}) {
        const previousScreen = current;
        if (!options.fromHistory &amp;&amp; screen !== previousScreen) navigationHistory.push(previousScreen);
        if (!options.fromHistory &amp;&amp; screen === &#x27;darshan&#x27;) navigationHistory.length = 0;
        if (screen !== &#x27;inner-room&#x27;) stopMeditationSound();
        if (screen !== &#x27;inner-sound&#x27;) stopInnerSound();
        current = screen;
        const template = root.querySelector(`#sas-screen-${screen}`);
        if (!template) return;
        mount.replaceChildren(template.content.cloneNode(true));
        if (screen === &#x27;darshan&#x27;) renderFocusCampaignPreview();
        if (screen === &#x27;reflections&#x27;) renderReflectionsPage();
        if (screen === &#x27;reflection-detail&#x27;) renderReflectionDetail();
        const scrollRoot = document.scrollingElement;
        if (scrollRoot) scrollRoot.scrollTop = 0;
        setBoardButton(screen);
        bindScreen();
      }

      function goBack() {
        const previousScreen = navigationHistory.pop() || &#x27;darshan&#x27;;
        render(previousScreen, { fromHistory: true });
      }
