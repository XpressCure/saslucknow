<VirtualHost *:80>
    ServerName www.saslucknow.in
    ServerAlias saslucknow.in

    ProxyPreserveHost On
    ProxyPass /api/gallery-submissions http://127.0.0.1:3001/api/gallery-submissions
    ProxyPassReverse /api/gallery-submissions http://127.0.0.1:3001/api/gallery-submissions
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog /var/log/httpd/saslucknow-error.log
    CustomLog /var/log/httpd/saslucknow-access.log combined
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =www.saslucknow.in [OR]
    RewriteCond %{SERVER_NAME} =saslucknow.in
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
