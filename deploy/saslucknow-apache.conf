<VirtualHost *:80>
    ServerName www.saslucknow.in
    ServerAlias saslucknow.in

    ProxyPreserveHost On
    ProxyPass /api/participation/ http://127.0.0.1:3002/api/participation/
    ProxyPassReverse /api/participation/ http://127.0.0.1:3002/api/participation/
    ProxyPass /api/pushpanjali-offerings http://127.0.0.1:3001/api/pushpanjali-offerings
    ProxyPassReverse /api/pushpanjali-offerings http://127.0.0.1:3001/api/pushpanjali-offerings
    ProxyPass /api/savitri-video-media/ http://127.0.0.1:3001/api/savitri-video-media/
    ProxyPassReverse /api/savitri-video-media/ http://127.0.0.1:3001/api/savitri-video-media/
    ProxyPass /api/savitri-videos http://127.0.0.1:3001/api/savitri-videos
    ProxyPassReverse /api/savitri-videos http://127.0.0.1:3001/api/savitri-videos
    ProxyPass /api/savitri-video-submissions http://127.0.0.1:3001/api/savitri-video-submissions
    ProxyPassReverse /api/savitri-video-submissions http://127.0.0.1:3001/api/savitri-video-submissions
    ProxyPass /api/gallery-media/ http://127.0.0.1:3001/api/gallery-media/
    ProxyPassReverse /api/gallery-media/ http://127.0.0.1:3001/api/gallery-media/
    ProxyPass /api/gallery-items http://127.0.0.1:3001/api/gallery-items
    ProxyPassReverse /api/gallery-items http://127.0.0.1:3001/api/gallery-items
    ProxyPass /api/gallery-submissions http://127.0.0.1:3001/api/gallery-submissions
    ProxyPassReverse /api/gallery-submissions http://127.0.0.1:3001/api/gallery-submissions
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog /var/log/httpd/saslucknow-error.log
    CustomLog /var/log/httpd/saslucknow-access.log combined
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =www.saslucknow.in [OR]
    RewriteCond %{SERVER_NAME} =saslucknow.in
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
