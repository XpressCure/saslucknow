<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.saslucknow.in
    ServerAlias saslucknow.in

    ProxyPreserveHost On
    ProxyPass /api/gallery-media/ http://127.0.0.1:3001/api/gallery-media/
    ProxyPassReverse /api/gallery-media/ http://127.0.0.1:3001/api/gallery-media/
    ProxyPass /api/gallery-items http://127.0.0.1:3001/api/gallery-items
    ProxyPassReverse /api/gallery-items http://127.0.0.1:3001/api/gallery-items
    ProxyPass /api/gallery-submissions http://127.0.0.1:3001/api/gallery-submissions
    ProxyPassReverse /api/gallery-submissions http://127.0.0.1:3001/api/gallery-submissions
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog /var/log/httpd/saslucknow-error.log
    CustomLog /var/log/httpd/saslucknow-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/saslucknow.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/saslucknow.in/privkey.pem
</VirtualHost>
</IfModule>
